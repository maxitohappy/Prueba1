{% extends "base.html" %}
{% block title %}Nueva contraseña · Clima Santiago{% endblock %}
{% block content %}
<h1>Nueva contraseña</h1>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Contraseña nueva <input name="password" type="password" autocomplete="new-password" required></label>
  <label>Repite la contraseña <input name="password2" type="password" autocomplete="new-password" required></label>
  <button type="submit">Guardar</button>
</form>
{% endblock %}
